#-------------------------------------------------------------------
# < T M U X >  Quick Reference Manual
#-------------------------------------------------------------------
#
# 🔰 tmux Quick Reference (Prefix: Ctrl-g)
#
#-------------------------------------------------------------------
# Window (ウィンドウ)
#-------------------------------------------------------------------
# + c : 新規ウィンドウの作成 (create new window)
# + p : 前のウィンドウへ移動 (previous window)
# + n : 次のウィンドウへ移動 (next window)
# + w : ウィンドウ一覧から選択 (list windows)
# + , : ウィンドウ名の変更 (rename window)
# + & : ウィンドウを閉じる (kill window)
#
#-------------------------------------------------------------------
# Pane (ペイン/区画)
#-------------------------------------------------------------------
# + %   : 垂直方向の分割 (split pane vertically)
# + "   : 水平方向の分割 (split pane horizontally)
# + 方向キー: 分割したペイン間の移動 (move between panes)
# + o   : 次のペインへ移動 (go to next pane)
# + x   : 現在のペインを閉じる (kill current pane)
# + z   : 現在のペインを拡大/元に戻す (zoom/unzoom pane)
#
#-------------------------------------------------------------------
# Session (セッション)
#-------------------------------------------------------------------
# + d   : セッションからデタッチ (detach session)
# + $   : セッション名の変更 (rename session)
#
#-------------------------------------------------------------------
#
#           +---------+---------+
#           |         |         |
#           |  Pane 1 |  Pane 2 |  <-  + % (垂直分割) or |
#           |   ( + oで移動 )   |
#           +---------+---------+
#           |                   |
#           |      Pane 3       |  <-  + " (水平分割) or -
#           |                   |
#           +-------------------+
#
# -------------------------------------------------------------------
# 💻 ターミナルで
# $ tmux attach  : 既存セッションにアタッチ
# $ tmux new -s name : セッション名"name"で新規作成
# -------------------------------------------------------------------

# 参考URL
## https://qiita.com/kalafinalice/items/c02c0345293fe60af6e5

set -g prefix C-g
set -g prefix2 C-b

set-option -g default-shell "${SHELL}"
set -g default-command "${SHELL}"

## 256色端末を使用する。
# set -g default-terminal "screen-256color"
# set -g terminal-overrides 'xterm:colors=256'
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ',xterm-256color:RGB'

# ESC キーの遅延を解消
set -s escape-time 0
## status line を更新する間隔を1秒にする
set-option -g status on
set-option -g status-interval 1

# Window名を勝手に変更しない
set -g allow-rename off

# 他Windowで出力があったら通知
setw -g monitor-activity on
set -g visual-activity on

# キーバインドvim風に
set-window-option -g mode-keys vi

# 'v' で選択を始める(コピーモードの時)
# 'V'で行選択は効くが、なぜか'v'で選択が効かなかったため
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"


# マウススクロール
set -g mouse on
bind-key -T edit-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T edit-mode-vi WheelDownPane send-keys -X scroll-down


# クリップボードにコピー
# マウススクロールをオンにすると、マウス選択コピーがクリップボードにコピーされなくなるため
set -s copy-command 'pbcopy' 

# 設定ファイル再読み込み r
bind r source-file ~/.tmux.conf \; display "Reloaded"

# ペイン操作
# "|" でペインを縦分割する（現在のディレクトリを引き継ぐ）
bind | split-window -h -c "#{pane_current_path}"

# "-" でペインを横分割する（現在のディレクトリを引き継ぐ）
bind - split-window -v -c "#{pane_current_path}"

# vimのキーバインドでペインを移動する
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Paneの移動をprefixなしで行う(Shift + arrow keys)
bind -n S-left select-pane -L
bind -n S-down select-pane -D
bind -n S-up select-pane -U
bind -n S-right select-pane -R

# Paneを順に移動する
bind -n C-o select-pane -t :.+

# 全ペインへ同時入力 ON/OFF
bind A setw synchronize-panes \; display-message "synchronize-panes: #{?pane_synchronized,ON,OFF}"

# Paneのサイズ調整
bind H resize-pane -L 3
bind L resize-pane -R 3
bind K resize-pane -U 3
bind J resize-pane -D 3
bind-key -n M-Left  resize-pane -L 1
bind-key -n M-Right resize-pane -R 1
bind-key -n M-Up    resize-pane -U 1
bind-key -n M-Down  resize-pane -D 1
bind-key -n S-M-Left  resize-pane -L 5
bind-key -n S-M-Right resize-pane -R 5
bind-key -n S-M-Up    resize-pane -U 5
bind-key -n S-M-Down  resize-pane -D 5

# ペイン番号を表示
bind Space display-panes

# ペインの開始番号を 0 から 1 に変更する
set-option -g base-index 1
setw -g pane-base-index 1

##### Pane / Theme colors ####################################
#
# Prefix + F1 = DEFAULT
# Prefix + F2 = RED
# Prefix + F3 = PURPLE
# Prefix + F4 = GREEN
# Prefix + F5 = NAVY
#
# DEFAULT設定:
#   set -g window-style "bg=colour239"
#   set -g window-active-style "bg=colour234"
#
# F1 を押すとこのDEFAULT設定に戻します。
#
# window-style        = 非アクティブペイン背景
# window-active-style = アクティブペイン背景
# status-style        = ステータスバー
# status-right        = 右側のテーマ名表示
#

# DEFAULT: これまでの見た目
set -g status-right "%Y-%m-%d %H:%M"
set -g window-style "bg=colour239"
set -g window-active-style "bg=colour234"

bind-key F1 \
    set -g status-style "bg=default,fg=default" \;\
    set -g status-right "%Y-%m-%d %H:%M" \;\
    set -g pane-active-border-style "default" \;\
    set -g pane-border-style "default" \;\
    set -g window-style "bg=colour239" \;\
    set -g window-active-style "bg=colour234" \;\
    display-message "Theme: DEFAULT"

# RED: はっきり赤。colour160 より colour196 の方が赤く見えやすい
bind-key F2 \
    set -g status-style "bg=colour196,fg=white" \;\
    set -g status-right "[RED] | %Y-%m-%d %H:%M" \;\
    set -g pane-active-border-style "fg=colour196" \;\
    set -g pane-border-style "fg=colour88" \;\
    set -g window-style "bg=colour52" \;\
    set -g window-active-style "bg=colour88" \;\
    display-message "Theme: RED"

# PURPLE: 黄色の代替。検証・ステージング向け
bind-key F3 \
    set -g status-style "bg=colour93,fg=white" \;\
    set -g status-right "[PURPLE] | %Y-%m-%d %H:%M" \;\
    set -g pane-active-border-style "fg=colour93" \;\
    set -g pane-border-style "fg=colour54" \;\
    set -g window-style "bg=colour53" \;\
    set -g window-active-style "bg=colour54" \;\
    display-message "Theme: PURPLE"

# GREEN: 開発向け
bind-key F4 \
    set -g status-style "bg=colour46,fg=black" \;\
    set -g status-right "[GREEN] | %Y-%m-%d %H:%M" \;\
    set -g pane-active-border-style "fg=colour46" \;\
    set -g pane-border-style "fg=colour22" \;\
    set -g window-style "bg=colour22" \;\
    set -g window-active-style "bg=colour28" \;\
    display-message "Theme: GREEN"

# NAVY: 濃い青。status bar の白文字が見えるようにする
bind-key F5 \
    set -g status-style "bg=colour18,fg=white" \;\
    set -g status-right "[NAVY] | %Y-%m-%d %H:%M" \;\
    set -g pane-active-border-style "fg=colour25" \;\
    set -g pane-border-style "fg=colour17" \;\
    set -g window-style "bg=colour17" \;\
    set -g window-active-style "bg=colour18" \;\
    display-message "Theme: NAVY"
